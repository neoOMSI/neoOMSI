name: Bug / Compatibility Report
description: Report broken behaviour or a difference from OMSI 2
labels: ["bug", "status: untriaged"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. neoOMSI is currently compatibility-first.
        If this differs from OMSI 2, testing the same content in OMSI 2.2.032 is especially useful.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observable problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable reproduction you can.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Content used
      description: Map, vehicle, plugin or other OMSI content involved. Include version/source when relevant.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead?
    validations:
      required: true

  - type: dropdown
    id: omsi-comparison
    attributes:
      label: OMSI 2.2.032 comparison
      description: Did you test the same scenario in OMSI 2.2.032?
      options:
        - "Yes – OMSI behaves differently"
        - "Yes – OMSI has the same problem"
        - "Not tested"
        - "Not applicable"
    validations:
      required: true

  - type: textarea
    id: omsi-result
    attributes:
      label: What does OMSI 2.2.032 do?
      description: If tested, describe the result and use the same content/settings where possible.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: neoOMSI version
      placeholder: e.g. 0.2.0-nightly.g8742a619
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant errors or logs. Remove personal information first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video
      description: Add visual evidence if it helps demonstrate the difference.
    validations:
      required: false
