# Builds the website (site/, which bundles docs/*.md) and deploys it to the neoomsi-site Cloudflare Worker.
name: Website

on:
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "assets/logos/**",
        "assets/icons/app/**",
        "README.md",
        ".github/workflows/site.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "docs/**",
        "assets/logos/**",
        "assets/icons/app/**",
        "README.md",
        ".github/workflows/site.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Website
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    environment:
      name: website
      url: https://neoomsi.com/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run deploy
