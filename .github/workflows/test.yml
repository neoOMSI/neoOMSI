name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  changes:
    name: Detect test-relevant changes
    runs-on: ubuntu-slim

    outputs:
      run-tests: ${{ steps.changes.outputs.run-tests }}
      run-bundle: ${{ steps.changes.outputs.run-bundle }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: bash scripts/ci/detect-test-changes.sh

      - name: Validate release publishing logic
        shell: bash
        run: bash scripts/ci/test-publish-release-logic.sh

  test:
    name: Workspace tests
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Preserve compiled dependencies from main even when a later test fails.
          # Otherwise the next run has to rebuild the entire workspace from scratch.
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --locked

  bundle:
    name: Combined bundle verification
    needs: changes
    if: needs.changes.outputs.run-bundle == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run combined bundle test
        shell: pwsh
        run: scripts/ci/test-combined-bundle.ps1

  required:
    name: Tests
    needs: [changes, test, bundle]
    if: always()
    runs-on: ubuntu-slim

    steps:
      - name: Verify test result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run-tests }}
          RUN_BUNDLE: ${{ needs.changes.outputs.run-bundle }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection failed."
            exit 1
          fi

          if [ "$RUN_TESTS" = "true" ]; then
            if [ "$TEST_RESULT" != "success" ]; then
              echo "::error::Workspace tests were required but did not pass."
              exit 1
            fi
            echo "Workspace tests passed."
          else
            echo "No Rust/test-relevant changes. Workspace tests were safely skipped."
          fi

          if [ "$RUN_BUNDLE" = "true" ]; then
            if [ "$BUNDLE_RESULT" != "success" ]; then
              echo "::error::Combined bundle verification was required but did not pass."
              exit 1
            fi
            echo "Combined bundle verification passed."
          else
            echo "No bundle-relevant changes. Bundle verification was safely skipped."
          fi
