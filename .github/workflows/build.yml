name: Build

on:
  schedule:
    # Early morning German time, DST-aware. Running at 03:37 avoids both
    # midnight UTC traffic and top-of-hour GitHub Actions scheduling peaks.
    - cron: "37 3 * * *"
      timezone: "Europe/Berlin"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            case "$v" in
              *-nightly.*) channel=nightly ;;
              *-rc.*) channel=rc ;;
              *) channel=stable ;;
            esac
          else
            channel=nightly
            short_sha="${GITHUB_SHA:0:8}"
            v="$(sh scripts/version.sh)-nightly.g${short_sha}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          echo "### neoOMSI ${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA:0:8}\` · Actions run #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    permissions:
      contents: read
    uses: ./.github/workflows/build-target.yml
    with:
      platform: windows
      runner: windows-latest
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      cache_write: ${{ github.ref == 'refs/heads/main' }}
      direct_artifact: false
      retention_days: 1

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    permissions:
      contents: read
    uses: ./.github/workflows/build-target.yml
    with:
      platform: macos
      runner: macos-latest
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      cache_write: ${{ github.ref == 'refs/heads/main' }}
      direct_artifact: false
      retention_days: 1

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    permissions:
      contents: read
    uses: ./.github/workflows/build-target.yml
    with:
      platform: linux
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      cache_write: ${{ github.ref == 'refs/heads/main' }}
      direct_artifact: false
      retention_days: 1

  release:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        shell: bash
        run: bash scripts/ci/publish-release.sh
