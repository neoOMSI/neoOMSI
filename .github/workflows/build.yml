name: Build

on:
  schedule:
    # Early morning German time, DST-aware. Running at 03:37 avoids both
    # midnight UTC traffic and top-of-hour GitHub Actions scheduling peaks.
    - cron: "37 3 * * *"
      timezone: "Europe/Berlin"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            short_sha="${GITHUB_SHA:0:8}"
            v="$(sh scripts/version.sh)-nightly.g${short_sha}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          echo "### neoOMSI ${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA:0:8}\` · Actions run #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      neoomsi_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: cmd
        run: scripts\build-windows.cmd ${{ matrix.target }}
      - name: DirectX shader compiler and Visual C++ runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -ExecutionPolicy Bypass -File scripts/ci/setup-windows-deps.ps1 -Arch ${{ matrix.arch }}
      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/ci/package-windows.ps1 -Arch ${{ matrix.arch }} -Version $env:neoomsi_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: out/*.zip
          compression-level: 0
          retention-days: 1

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    env:
      neoomsi_VERSION: ${{ needs.version.outputs.version }}
      neoomsi_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: scripts/build-macos.sh
      - name: Package
        run: bash scripts/ci/package-posix.sh macos ${{ matrix.arch }} $neoomsi_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: out/*.zip
          compression-level: 0
          retention-days: 1

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      neoomsi_VERSION: ${{ needs.version.outputs.version }}
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev \
              libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev zip clang lld && break
            sleep 20
          done
      - name: Build the game
        run: scripts/build-linux.sh
      - name: Build the server
        run: scripts/build-server.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Validate shaders
        if: matrix.arch == 'x64'
        run: cargo nextest run --locked --release -p omsi-render -E 'test(shaders_validate_and_match_the_uniforms)'
      - name: Package
        run: bash scripts/ci/package-posix.sh linux ${{ matrix.arch }} $neoomsi_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: out/*.zip
          compression-level: 0
          retention-days: 1

  release:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        shell: bash
        run: bash scripts/ci/publish-release.sh
