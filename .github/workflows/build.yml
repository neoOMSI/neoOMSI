name: Build

on:
  schedule:
    # Runs nightly at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sh scripts/version.sh)-nightly.${{ github.run_number }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: echo "### neoOMSI ${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      neoomsi_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: cmd
        run: scripts\build-windows.cmd ${{ matrix.target }}
      - name: DirectX shader compiler
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" -D dxc
          $zip = Get-ChildItem dxc/*.zip | Where-Object { $_.Name -notmatch "linux|pdb" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dxc/x
          $arch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "x64" }
          Copy-Item "dxc/x/bin/$arch/dxcompiler.dll", "dxc/x/bin/$arch/dxil.dll" dist/windows/
      - name: Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\${{ matrix.arch }}\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          $dir = if ($crt) { $crt.FullName } elseif ("${{ matrix.arch }}" -eq "x64") { "$env:SystemRoot\System32" } else { throw "no ARM64 Visual C++ runtime in $vs" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            Copy-Item (Join-Path $dir $dll) dist/windows/
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $out = (Resolve-Path out).Path
          Copy-Item README.md, LICENSE dist/windows/
          New-Item -ItemType Directory -Force dist/server | Out-Null
          Copy-Item dist/windows/neoomsi.exe, dist/windows/vcruntime140.dll, dist/windows/vcruntime140_1.dll, dist/windows/msvcp140.dll, scripts/server/start.cmd, LICENSE dist/server/
          Copy-Item docs/SERVER.md dist/server/README.md
          New-Item -ItemType File -Force dist/server/.neoomsi-content | Out-Null
          Push-Location dist/windows
          7z a -tzip -mx=5 "$out/neoOMSI-$env:neoomsi_VERSION-windows-${{ matrix.arch }}.zip" *
          Pop-Location
          Push-Location dist/server
          7z a -tzip -mx=5 "$out/neoOMSI-$env:neoomsi_VERSION-server-windows-${{ matrix.arch }}.zip" *
          Pop-Location
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: out/*.zip
          compression-level: 0
          retention-days: 1

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    env:
      neoomsi_VERSION: ${{ needs.version.outputs.version }}
      neoomsi_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: scripts/build-macos.sh
      - name: Package
        run: |
          mkdir -p out
          cp README.md LICENSE dist/macos/
          cd dist/macos && ditto -c -k --sequesterRsrc . "../../out/neoOMSI-$neoomsi_VERSION-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: out/*.zip
          compression-level: 0
          retention-days: 1

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      neoomsi_VERSION: ${{ needs.version.outputs.version }}
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: System libraries
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev \
              libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev zip clang lld && break
            sleep 20
          done
      - name: Build the game
        run: scripts/build-linux.sh
      - name: Build the server
        run: scripts/build-server.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Validate shaders
        if: matrix.arch == 'x64'
        run: cargo nextest run --locked --release -p omsi-render -E 'test(shaders_validate_and_match_the_uniforms)'
      - name: Package
        run: |
          mkdir -p out
          cp README.md LICENSE dist/linux/
          cp LICENSE dist/server/
          (cd dist/linux && zip -qr "../../out/neoOMSI-$neoomsi_VERSION-linux-${{ matrix.arch }}.zip" .)
          (cd dist/server && zip -qr "../../out/neoOMSI-$neoomsi_VERSION-server-linux-${{ matrix.arch }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: out/*.zip
          compression-level: 0
          retention-days: 1

  release:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish v${{ needs.version.outputs.version }}
        run: |
          ls -l out
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            awk -v v="## $VERSION" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {f = 1; next} f && /^## / {exit} f {print}' CHANGELOG.md > changes.md
          else
            : > changes.md
            for f in .changes/*.md; do
              [ -f "$f" ] || continue
              [ "$(basename "$f")" = "README.md" ] && continue
              cat "$f" >> changes.md
              echo >> changes.md
            done
          fi
          if ! grep -q '[^[:space:]]' changes.md; then
            prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
            if [ -n "$prev" ]; then
              git diff --unified=0 "$prev" HEAD -- CHANGELOG.md | grep '^+' | grep -v '^+++' | sed 's/^+//' | grep -v '^## ' > changes.md || true
            fi
          fi
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "Small changes and fixes." > changes.md
          fi
          cat > notes.md <<NOTES
          **neoOMSI $VERSION**

          > **Early release, expect bugs.** neoOMSI needs an original OMSI 2 installation to run; it contains no game content.

          NOTES
          cat changes.md >> notes.md
          cat >> notes.md <<NOTES

          ### Downloads

          | Platform | Download |
          | --- | --- |
          | Windows x64 | \`neoOMSI-$VERSION-windows-x64.zip\` |
          | Windows ARM64 | \`neoOMSI-$VERSION-windows-arm64.zip\` |
          | macOS (Apple silicon) | \`neoOMSI-$VERSION-macos-arm64.zip\` |
          | macOS (Intel) | \`neoOMSI-$VERSION-macos-x64.zip\` |
          | Linux x64 | \`neoOMSI-$VERSION-linux-x64.zip\` |
          | Linux ARM64 | \`neoOMSI-$VERSION-linux-arm64.zip\` |
          | Dedicated server, Linux | \`neoOMSI-$VERSION-server-linux-x64.zip\`, \`neoOMSI-$VERSION-server-linux-arm64.zip\` |
          | Dedicated server, Windows | \`neoOMSI-$VERSION-server-windows-x64.zip\`, \`neoOMSI-$VERSION-server-windows-arm64.zip\` |
          NOTES
          if [ "$PRERELEASE" = "true" ]; then
            flag="--prerelease"
          else
            flag="--prerelease=false"
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            gh release delete "$TAG" --cleanup-tag --yes || true
            gh release create "$TAG" out/*.zip \
              --target "$GITHUB_SHA" \
              --title "neoOMSI $VERSION" \
              --notes-file notes.md \
              "$flag"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zip --clobber
            gh release edit "$TAG" --title "neoOMSI $VERSION" --notes-file notes.md "$flag"
          else
            gh release create "$TAG" out/*.zip \
              --verify-tag \
              --title "neoOMSI $VERSION" \
              --notes-file notes.md \
              "$flag"
          fi