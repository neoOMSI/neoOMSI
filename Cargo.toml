[workspace]
resolver = "2"
members = [
    "crates/omsi-cfg",
    "crates/omsi-script",
    "crates/omsi-o3d",
    "crates/omsi-model",
    "crates/omsi-scenery",
    "crates/omsi-map",
    "crates/omsi-vehicle",
    "crates/omsi-timetable",
    "crates/omsi-content",
    "crates/omsi-texture",
    "crates/omsi-geometry",
    "crates/omsi-render",
    "crates/omsi-sim",
    "crates/omsi-audio",
    "crates/omsi-net",
    "crates/omsi-plugin",
    "crates/omsi-plugin/demo",
    "crates/omsi-ui",
    "crates/omsi-launcher-core",
    "crates/omsi-app",
    "tools/omsi-check",
]
exclude = ["launcher/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
encoding_rs = "0.8"
glam = "0.33"
rayon = "1.10"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
hashbrown = "0.17"
smallvec = "1"
parking_lot = "0.12"
rand = "0.10"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "gles", "wgsl", "noop"] }
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tga", "dds", "jpeg"] }

[profile.release]
opt-level = 3
debug = 1
codegen-units = 4
lto = "thin"

[profile.dev]
opt-level = 1
debug = 0
incremental = true

# dependencies are built optimised once and then stay cached
[profile.dev.package."*"]
opt-level = 3
debug = 0

# our own crates that are slow at load time in dev
[profile.dev.package.omsi-o3d]
opt-level = 3
[profile.dev.package.omsi-texture]
opt-level = 3
[profile.dev.package.omsi-scenery]
opt-level = 3

# A release-like build for local Windows testing. It keeps the normal optimisation level but
# skips the slower release-only work. The proper release profile is still used for PRs and
# published builds.
[profile.dev-release]
inherits = "release"
debug-assertions = true
debug = 0
lto = false
codegen-units = 16
incremental = true

# the Android build (scripts/build-android.sh): the release profile without debug info (a
# phone's app carries no 300 MB of symbols)
[profile.android]
inherits = "release"
debug = 0
strip = "debuginfo"