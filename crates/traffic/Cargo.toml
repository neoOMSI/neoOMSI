[package]
name = "traffic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless traffic domain: lane network, rules, signals, routing, following, and AI road-vehicle state"

[dependencies]
glam.workspace = true
hashbrown.workspace = true
log.workspace = true

# A std-only, harness-free benchmark so no benchmarking dependency enters the crate tree
# (`cargo tree -p traffic` stays glam/hashbrown/log). See `benches/domain.rs`.
[[bench]]
name = "domain"
harness = false
