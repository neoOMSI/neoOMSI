[package]
name = "legacy-launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher's data side: maps, buses, lines, profiles, settings, mod installs, running games"

[lib]
name = "omsi_launcher_lib"
path = "src/lib.rs"

[[bin]]
name = "neoomsi-launcher"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true
rayon.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "deflate"] }
unrar-rs = { version = "0.10", default-features = false, features = ["crypto-rust"] }
config = { path = "../config" }
legacy-config = { path = "../legacy-config" }
map = { path = "../map" }
legacy-vehicle = { path = "../vehicle" }
timetable = { path = "../timetable" }
content = { path = "../content" }
model = { path = "../model" }
network = { path = "../network" }
launcher-protocol = { path = "../launcher-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"