[package]
name = "network"
version = "0.1.0"
edition = "2024"

[dependencies]
log.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
sha2 = "0.11"
ring = "0.17"
socket2 = "0.6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
