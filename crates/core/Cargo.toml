[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The neoOMSI application: loads a map and renders it"

# The game is a library with a small `main` around it: the Android build takes the same
# library as a shared object (`cargo rustc --lib --crate-type cdylib`, see
# scripts/build-android.sh), which the phone's NativeActivity loads.
[lib]
name = "neoomsi_game"
path = "src/lib.rs"

[[bin]]
name = "neoomsi"
path = "src/main.rs"

[features]
# This will add the dev ui (ImGui) only in dev builds, so this can't be in a release build.
default = ["devtools"]
devtools = ["dep:imgui", "dep:bytemuck", "render/devtools"]

[build-dependencies]
winresource = "0.1"

[dependencies]
legacy-config = { path = "../legacy-config" }
config = { path = "../config" }
logging = { path = "../logging" }
map = { path = "../map" }
scenery = { path = "../scenery" }
model = { path = "../model" }
legacy-o3d = { path = "../legacy-o3d" }
texture = { path = "../texture" }
geometry = { path = "../geometry" }
render = { path = "../render" }
simulation = { path = "../simulation" }
legacy-plugin = { path = "../legacy-plugin" }
legacy-vehicle = { path = "../vehicle" }
content = { path = "../content" }
timetable = { path = "../timetable" }
legacy-script = { path = "../legacy-script" }
audio = { path = "../audio" }
wgpu.workspace = true
winit.workspace = true
glam.workspace = true
pollster.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
getrandom = "0.4"
rayon.workspace = true
network = { path = "../network" }
user-interface = { path = "../user-interface" }
i18n = { path = "../i18n" }
launcher-protocol = { path = "../launcher-protocol" }
legacy-launcher-core = { path = "../legacy-launcher-core" }
serde = { version = "1", features = ["derive"] }
hashbrown.workspace = true
parking_lot.workspace = true
image.workspace = true
serde_json = "1"
ab_glyph = "0.2"
rustrict = "0.7"
gilrs = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
imgui = { version = "0.12", optional = true }
bytemuck = { workspace = true, optional = true }
# updates: the release archives from GitHub
zip = { version = "8", default-features = false, features = ["deflate"] }

# the desktop's clipboard and file dialogs (a phone has neither in this form)
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false }
rfd = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the game controllers through DirectInput, as OMSI reads them (see `dinput`)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
openxr = { version = "0.22", default-features = false, features = ["static"] }
wgpu-hal = { version = "30", features = ["dx12"] }

# macOS: the axes of wheels and pedals straight from their HID elements (see `mac_hid`)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFSet", "CFString", "CFDictionary", "CFNumber"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "hid"] }

# the interface's machine translation (`mt`): CTranslate2 with Meta's NLLB model, as the
# `trad` crate does it (Apple's Accelerate for the maths; Apple silicon only)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ct2rs = { version = "0.10", default-features = false, features = ["tokenizers", "accelerate", "ruy"] }

# Android: winit's NativeActivity backend, the system log, and JNI for the few things only
# Java offers (storage permission, the screen's cut-outs, vibration)
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"
