syntax = "proto3";

package neoomsi.launcher;

import "launcher.proto";

message GameHello {
  string instance = 1;
  string token = 2;
  uint32 pid = 3;
  string version = 4;
}

message FromGame {
  oneof body {
    GameHello hello = 1;
    GameLink state = 2;
  }
}

message ToGame {
  oneof body {
    Empty welcome = 1;
    string refused = 2;
    Empty quit = 3;
  }
}
