[package]
name = "texture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Texture loading (bmp/tga/dds/jpg/png) with OMSI's lookup rules and .cfg sidecars (unit mc_texMan)"

[dependencies]
legacy-config = { path = "../legacy-config" }
mods = { path = "../mods" }
image = { version = "0.25", default-features = false, features = ["bmp", "tga", "dds", "jpeg", "png"] }
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
hashbrown.workspace = true
rayon.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tga", "dds", "jpeg"] }
