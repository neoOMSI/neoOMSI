[package]
name = "render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[dependencies]
legacy-config = { path = "../legacy-config" }
geometry = { path = "../geometry" }
texture = { path = "../texture" }
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
hashbrown.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[features]
devtools = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"

[dev-dependencies]
naga = { version = "30", features = ["spv-out"] }