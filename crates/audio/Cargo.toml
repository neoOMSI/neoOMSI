[package]
name = "audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio: cpal mixer with pitch/gain/3D voices, WAV loading, and the OMSI sound-config runtime (unit mc_sound)"

[dependencies]
legacy-vehicle = { path = "../vehicle" }
legacy-config = { path = "../legacy-config" }
cpal = { version = "0.18", features = ["realtime"] }
parking_lot.workspace = true
hashbrown.workspace = true
glam.workspace = true
log.workspace = true
anyhow.workspace = true
# internet radio: MP3 / AAC / Ogg streams over HTTP(S)
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "ogg", "vorbis"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }

[dev-dependencies]
env_logger.workspace = true
